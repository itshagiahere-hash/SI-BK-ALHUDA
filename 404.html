<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 - SI-BK SMA IT Al Huda Wonogiri</title>
    <style>
      :root {
        --ink: #1f2421;
        --muted: #526057;
        --line: #dce1de;
        --primary: #216869;
        --soft: #f8f9f8;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Calibri, "Segoe UI", Arial, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 15% 20%, rgba(156, 197, 161, .20) 0 22px, transparent 23px),
          radial-gradient(circle at 85% 75%, rgba(33, 104, 105, .12) 0 28px, transparent 29px),
          linear-gradient(135deg, #eef2ef 0%, var(--soft) 48%, #dce1de 100%);
      }
      .shell {
        width: min(760px, calc(100% - 32px));
        padding: 28px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, .92);
        box-shadow: 0 26px 70px rgba(31, 36, 33, .12);
        display: grid;
        gap: 18px;
        text-align: center;
      }
      .brand {
        display: flex;
        justify-content: center;
      }
      .brand img {
        width: 170px;
        height: auto;
        object-fit: contain;
      }
      h1 {
        margin: 0;
        font-size: clamp(2rem, 4vw, 3rem);
        line-height: 1.05;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 1.03rem;
        line-height: 1.5;
      }
      .code {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 88px;
        height: 88px;
        margin: 0 auto;
        border-radius: 50%;
        color: var(--primary);
        border: 2px solid rgba(33, 104, 105, .18);
        background: rgba(33, 104, 105, .08);
        font-size: 2.2rem;
        font-weight: 800;
      }
      .actions {
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 140px;
        min-height: 44px;
        padding: 10px 18px;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 700;
      }
      .primary {
        color: #1f2421;
        background: #9cc5a1;
      }
      .secondary {
        color: var(--primary);
        border: 1px solid var(--line);
        background: #fff;
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <div class="brand">
        <img src="assets/SMAIT-transparent.png" alt="Logo SMA IT Al Huda Wonogiri">
      </div>
      <div class="code">404</div>
      <div>
        <h1>Halaman tidak ditemukan</h1>
        <p>Alamat yang dibuka tidak tersedia atau sudah dipindahkan. Silakan kembali ke beranda SI-BK.</p>
      </div>
      <div class="actions">
        <a class="primary" href="index.html">Kembali ke Beranda</a>
        <a class="secondary" href="error.html">Lihat Halaman Error</a>
      </div>
    </main>
  </body>
</html>
